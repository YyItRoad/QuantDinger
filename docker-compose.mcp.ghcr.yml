# QuantDinger MCP production overlay.
#
# Use together with docker-compose.ghcr.yml so the MCP gateway shares the
# existing backend service and Docker network without publishing port 7800:
#
#   docker compose \
#     -f docker-compose.ghcr.yml \
#     -f docker-compose.mcp.ghcr.yml \
#     up -d --no-deps mcp

services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/yyitroad/quantdinger-mcp}:${MCP_TAG:-latest}
    pull_policy: always
    container_name: quantdinger-mcp
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: ${MCP_PIDS_LIMIT:-256}
    env_file:
      - ./mcp.env
    environment:
      QUANTDINGER_BASE_URL: http://backend:5000
      QUANTDINGER_MCP_TRANSPORT: streamable-http
      QUANTDINGER_MCP_HOST: 0.0.0.0
      QUANTDINGER_MCP_PORT: 7800
      QUANTDINGER_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://trade.yangyang.fun}
      # Public TLS terminates before the private Docker hop. This does not make
      # port 7800 public; the service intentionally has no ports mapping.
      QUANTDINGER_MCP_ALLOW_HTTP: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quantdinger-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',7800),2); s.close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}
