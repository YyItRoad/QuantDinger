name: Read-only aggregate notification diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect aggregate booleans only without changing services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/quantdinger
            docker compose -f docker-compose.ghcr.yml exec -T celery-worker python - <<'PYREMOTE'
            import json, os
            from dotenv import load_dotenv
            load_dotenv(os.getenv("QUANTDINGER_ENV_FILE") or "/app/.env", override=False)
            from app.utils.db import get_db_connection
            from app.config.redis_urls import celery_broker_url
            from app.celery_app import celery_app
            from app.services.user_preferences import get_notification_settings
            from app.services.portfolio_monitor_notifications import resolve_notification_delivery
            import redis
            with get_db_connection() as db:
                cur=db.cursor()
                cur.execute("SET TRANSACTION READ ONLY")
                cur.execute("""SELECT NULLIF(payload_json,'')::jsonb->'_discipline_notice' AS meta
                    FROM qd_strategy_notifications WHERE user_id=1
                    AND NULLIF(payload_json,'')::jsonb->'_discipline_notice' IS NOT NULL
                    ORDER BY id DESC LIMIT 20""")
                metadata=[row["meta"] for row in cur.fetchall()]
                db.rollback()
                cur.close()
            flags={"notices_exist":bool(metadata),"external_acknowledged":any(m["delivered"] for m in metadata),"not_yet_attempted":any(m["attempts"]==0 for m in metadata),"published":any(m["published_at"]>0 for m in metadata),"retry_exhausted":any(m["attempts"]>=3 for m in metadata),"delivery_failed_or_unknown":any(r.get("diagnostic")=="delivery_failed_or_unknown" for m in metadata for r in m.get("results",{}).values()),"target_not_configured":any(r.get("diagnostic")=="target_not_configured" for m in metadata for r in m.get("results",{}).values())}
            settings=get_notification_settings(1) or {}
            channels=settings.get("default_channels") or []
            cfg=resolve_notification_delivery(1,{"channels":channels})
            flags["all_personal_targets_present"]=all(bool((cfg.get("targets") or {}).get(ch)) for ch in channels if ch!="browser")
            flags["maintenance_queued"]=redis.Redis.from_url(celery_broker_url(),socket_timeout=3,socket_connect_timeout=3).llen("maintenance")>0
            inspector=celery_app.control.inspect(timeout=4)
            registered=inspector.registered() or {}
            queues=inspector.active_queues() or {}
            flags["notice_task_registered"]=any("quantdinger.tasks.trade_discipline_notice" in names for names in registered.values())
            flags["maintenance_consumed"]=any(item["name"]=="maintenance" for items in queues.values() for item in items)
            from app.services.signal_notifier import SignalNotifier, _validate_outbound_http_url
            notifier=SignalNotifier()
            flags["email_selected"]="email" in channels
            flags["webhook_selected"]="webhook" in channels
            flags["telegram_selected"]="telegram" in channels
            flags["smtp_configured"]=bool(notifier.smtp_host and notifier.smtp_from)
            flags["telegram_token_present"]=bool((cfg.get("targets") or {}).get("telegram_bot_token"))
            if "webhook" in channels:
                _,error=_validate_outbound_http_url((cfg.get("targets") or {}).get("webhook"))
                flags["webhook_validation_passed"]=not bool(error)
                flags["webhook_dns_failed"]=error=="webhook_host_unresolvable"
                flags["webhook_private_blocked"]=error=="webhook_private_address_blocked"
            for channel in ("email","webhook","telegram","discord","phone"):
                flags["failed_"+channel]=any(m.get("results",{}).get(channel,{}).get("ok") is False and not m.get("results",{}).get(channel,{}).get("skipped") for m in metadata)
            print("NOTIFICATION_AGGREGATE",json.dumps(flags,sort_keys=True))
            PYREMOTE
            docker compose -f docker-compose.ghcr.yml logs --no-color --since 15m --tail 300 trading-worker celery-worker 2>/dev/null | python3 -c 'import sys,json; t=sys.stdin.read(); print("NOTICE_LOG_FLAGS",json.dumps({"queue_unavailable":"trade_discipline notice_queue_unavailable" in t,"record_failed":"trade_discipline notice_record_failed" in t,"poll_unavailable":"trade_discipline notice_poll_unavailable" in t,"unregistered_task":"Received unregistered task" in t,"delivery_logged":"trade_discipline notice_delivery" in t,"smtp_missing":"SMTP_HOST not configured" in t or "SMTP_FROM not configured" in t,"email_error":"email.error" in t,"webhook_timeout":"webhook.timeout" in t,"webhook_connection_error":"webhook.connection_error" in t,"webhook_error":"webhook.error" in t,"telegram_error":"telegram.error" in t},sort_keys=True))'
