name: Preload candidate image without activation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cache immutable candidate image without starting services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            docker image pull ghcr.io/yyitroad/quantdinger-backend:manual-83d5a00
            docker image inspect ghcr.io/yyitroad/quantdinger-backend:manual-83d5a00 >/dev/null
            echo "Candidate image cached; running services unchanged."
