name: MCP runtime configuration check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check runtime credentials without exposing values
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 1m
          script: |
            set -eu
            python3 - <<'PY'
            import hashlib,json,subprocess
            from pathlib import Path
            names=['QUANTDINGER_AGENT_TOKEN','QUANTDINGER_MCP_OAUTH_AGENT_TOKEN','QUANTDINGER_MCP_AUTH_TOKEN']
            values={}
            for line in Path('/opt/quantdinger/mcp.env').read_text().splitlines():
                if '=' in line and not line.lstrip().startswith('#'):
                    key,value=line.split('=',1)
                    values[key.strip()]=value.strip().strip('"').strip("'")
            code='import hashlib,json,os;names='+repr(names)+';print(json.dumps({k:hashlib.sha256(os.environ.get(k, "").encode()).hexdigest() for k in names}))'
            hashes=json.loads(subprocess.check_output(['docker','exec','quantdinger-mcp','python','-c',code],text=True))
            print('TOKEN_FILE_MATCH',json.dumps({k:hashlib.sha256(values.get(k,'').encode()).hexdigest()==hashes[k] for k in names}),flush=True)
            PY
            docker exec -i quantdinger-mcp python - <<'PY'
            import json,os,httpx
            with httpx.Client(base_url=os.environ['QUANTDINGER_BASE_URL'],timeout=10) as client:
                for name in ['QUANTDINGER_AGENT_TOKEN','QUANTDINGER_MCP_OAUTH_AGENT_TOKEN']:
                    response=client.get('/api/agent/v1/whoami',headers={'Authorization':'Bearer '+os.environ[name]})
                    data=(response.json().get('data') or {})
                    print('TOKEN_STATUS',json.dumps({'name':name,'http':response.status_code,'agent_name':data.get('agent_name'),'scopes':data.get('scopes')}),flush=True)
            PY
